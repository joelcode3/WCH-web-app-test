<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <!-- PLATZHALTER-Lageplan. Wird durch den echten Plan ersetzt (siehe js/config.js). -->
  <defs>
    <pattern id="wald" width="44" height="44" patternUnits="userSpaceOnUse">
      <rect width="44" height="44" fill="#5d8a4e"/>
      <circle cx="11" cy="11" r="10" fill="#4b7a3f"/>
      <circle cx="33" cy="20" r="11" fill="#43703a"/>
      <circle cx="18" cy="35" r="9" fill="#527f44"/>
      <circle cx="40" cy="41" r="6" fill="#4b7a3f"/>
    </pattern>
    <pattern id="gras" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="#e4ebd5"/>
      <path d="M4 12 l2 -4 M12 6 l1.5 -3" stroke="#cfdcb9" stroke-width="1.2"/>
    </pattern>
  </defs>

  <!-- Wald rundherum -->
  <rect width="1200" height="800" fill="url(#wald)"/>
  <!-- Platzfläche -->
  <rect x="50" y="60" width="1100" height="680" rx="28" fill="url(#gras)"/>

  <!-- Wiesen für Urlauber (spätere Ausbaustufe) -->
  <g fill="#eef3e3" stroke="#9fb58a" stroke-width="2" stroke-dasharray="8 6">
    <rect x="834" y="110" width="290" height="268" rx="14"/>
    <rect x="834" y="424" width="290" height="266" rx="14"/>
  </g>
  <g font-family="Inter, Arial, sans-serif" fill="#7d9468" text-anchor="middle">
    <text x="979" y="236" font-size="26" font-weight="700">Wiese A</text>
    <text x="979" y="262" font-size="15">Urlauber / Camper</text>
    <text x="979" y="550" font-size="26" font-weight="700">Wiese B</text>
    <text x="979" y="576" font-size="15">Urlauber / Camper</text>
  </g>

  <!-- Wege -->
  <g fill="#ddd2b8" stroke="#c6b893" stroke-width="1.5">
    <rect x="0" y="388" width="1150" height="26"/>
    <rect x="96" y="82" width="730" height="22" rx="6"/>
    <rect x="96" y="696" width="730" height="22" rx="6"/>
    <rect x="292" y="82" width="22" height="636"/>
    <rect x="592" y="82" width="22" height="636"/>
    <rect x="800" y="82" width="22" height="636"/>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-size="12" fill="#8a7b55" font-weight="600">
    <text x="440" y="405" text-anchor="middle" letter-spacing="2">HAUPTWEG</text>
    <text x="8" y="380">Einfahrt →</text>
  </g>

  <!-- Gebäude -->
  <g stroke="#7a6a4f" stroke-width="1.5">
    <rect x="56" y="338" width="38" height="40" rx="3" fill="#c9a66b"/>
    <rect x="940" y="330" width="80" height="40" rx="3" fill="#c9a66b"/>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-size="11" fill="#4a3d26" text-anchor="middle" font-weight="600">
    <text x="75" y="362">Rez.</text>
    <text x="980" y="354">Sanitär</text>
  </g>

  <!-- Wasserzeichen -->
  <text x="600" y="785" text-anchor="middle" font-family="Inter, Arial, sans-serif"
        font-size="14" fill="#ffffff" fill-opacity="0.85" letter-spacing="3" font-weight="700">
    PLATZHALTER – VORLÄUFIGER LAGEPLAN, NICHT MASSSTÄBLICH
  </text>
</svg>
