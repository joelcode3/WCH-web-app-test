<body>

        <strong>Waldcamping Hesedorf</strong>
        <small>Platzverwaltung</small>
      </span>

    <button type="button" id="sync-status" class="sync" hidden></button>
    <nav class="tabbar" aria-label="Hauptnavigation">
      <a href="#/karte" data-nav="karte" title="Karte">
        <svg viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zm0 0v14m6-12v14"/></svg>

        <span>Kartei</span>
      </a>
      <a href="#/todos" data-nav="todos" title="To-Dos">
        <svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M3.5 6l1.5 1.5L7.5 5M3.5 12l1.5 1.5 2.5-2.5M3.5 18l1.5 1.5 2.5-2.5"/></svg>

      <a href="#/daten" data-nav="daten" title="Daten">

      </a>

  <main id="main">
    <!-- Karte bleibt dauerhaft im DOM, damit Leaflet nicht neu initialisiert werden muss -->
    <section id="view-karte" class="view view-map" hidden>
      <div class="map-toolbar">
        <div class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
          <input id="map-search" type="search" placeholder="Parzelle, Name oder Zähler suchen…" autocomplete="off" aria-label="Suchen">
          <div id="map-search-results" class="search-results" hidden></div>
        </div>
        <div class="segmented" role="group" aria-label="Einfärbung">
          <button type="button" data-color="status" class="is-active">Status</button>
          <button type="button" data-color="supply">Versorgung</button>
        </div>
        <button type="button" id="btn-edit" class="btn btn-ghost btn-icon" aria-pressed="false" title="Karte bearbeiten">
          <svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4zM14 6l4 4"/></svg>
          <span>Bearbeiten</span>
        </button>
      </div>
      <div id="map-modebar" class="map-modebar" hidden></div>
      <div class="map-wrap">
        <div id="map" aria-label="Lageplan"></div>
        <div id="map-legend" class="legend"></div>
        <aside id="map-panel" class="panel" hidden aria-live="polite"></aside>
      </div>
    </section>

    <section id="view-page" class="view view-page" hidden></section>
  </main>

  <div id="auth" class="auth" hidden>
    <div class="auth-card">
      <div class="auth-brand">
        <svg class="tree" viewBox="0 0 26 34" aria-hidden="true"><path d="M13 0 8 8h3l-6 8h4l-7 9h9v9h4v-9h9l-7-9h4l-6-8h3z"/></svg>
        <div><strong>Waldcamping Hesedorf</strong><small>Platzverwaltung</small></div>
      </div>
      <div id="auth-body"></div>
    </div>
  </div>

  <dialog id="dialog" class="dialog"></dialog>
  <div id="toast" class="toast" role="status" hidden></div>

  <script src="vendor/leaflet/leaflet.js"></script>
