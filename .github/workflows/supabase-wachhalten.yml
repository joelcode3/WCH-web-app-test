# Hält das kostenlose Supabase-Projekt aktiv: Supabase pausiert Projekte, die 7 Tage
# lang nicht benutzt werden. Diese Aufgabe fragt alle 3 Tage kurz bei der Datenbank an.
# Es werden keine Daten gelesen (die Funktion ping() liefert nur "ok").
# Manuell starten: GitHub → Actions → "Supabase wach halten" → "Run workflow".
name: Supabase wach halten

on:
  schedule:
    - cron: '17 5 */3 * *'   # alle 3 Tage, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Supabase anfragen
        run: |
          URL=$(grep -oP "url: '\Khttps://[^']+" js/config.js || true)
          KEY=$(grep -oP "anonKey: '\K[^']+" js/config.js || true)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Keine Supabase-Zugangsdaten in js/config.js – nichts zu tun."; exit 0; fi
          code=$(curl -s -o out.txt -w '%{http_code}' -X POST "$URL/rest/v1/rpc/ping" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}')
          echo "ping → HTTP $code: $(head -c 200 out.txt)"
          if [ "$code" = "404" ]; then
            # Funktion ping() noch nicht angelegt (update-6.sql fehlt) → einfache Anfrage an eine Tabelle
            code=$(curl -s -o out.txt -w '%{http_code}' "$URL/rest/v1/team?select=email&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
            echo "team → HTTP $code"
          fi
          # Fehler nur, wenn Supabase gar nicht antwortet (z. B. Projekt bereits pausiert)
          if [ "$code" = "000" ] || [ "$code" -ge 500 ]; then
            echo "::error::Supabase antwortet nicht (HTTP $code). Ist das Projekt pausiert? Im Supabase-Dashboard wieder aktivieren."
            exit 1
          fi
